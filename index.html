<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Essence POS" />
  <meta name="theme-color" content="#24382b" />
  <script>
  const isStaffPortal =
    new URLSearchParams(window.location.search).get("portal") === "staff";

  document.write(
    '<link rel="manifest" href="' +
    (isStaffPortal ? "/staff-manifest.json" : "/manifest.json") +
    '">'
  );
</script>
  <link rel="apple-touch-icon" href="/IMG_0001.jpeg" />
  <title>Essence Salon POS</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((error) => {
        console.error("Service worker registration failed:", error);
      });
    });
  }
</script>
</body>
</html>
